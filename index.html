<style>
/* Layout: one column study desk. Sticky date bar on top, session cards in the middle, four-tab bar at the bottom.
   Palette: charcoal ground, bone text, oxblood accent, matching the Ashmoor site. */
:root {
  --bg: #ece6da;
  --surface: #f6f2e9;
  --line: #cfc6b4;
  --fg: #1e1819;
  --muted: #6c6258;
  --accent: #6b1f24;
  --accent-ink: #f6f2e9;
  --ok: #2f6b45;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Spectral", "Iowan Old Style", Georgia, serif;
  --ui: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161315; --surface: #211c1e; --line: #3b3134; --fg: #e9e1d3; --muted: #a2978b;
    --accent: #e0958a; --accent-ink: #1b1214; --ok: #7fbf96; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161315; --surface: #211c1e; --line: #3b3134; --fg: #e9e1d3; --muted: #a2978b;
  --accent: #e0958a; --accent-ink: #1b1214; --ok: #7fbf96; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; }
button, textarea, input { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* date bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 0 10px; }
.bar .motto { font-family: var(--ui); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0; }
.bar .row { display: flex; align-items: center; gap: 8px; }
.bar h1 { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1; margin: 2px 0 0; flex: 1; min-width: 0; text-wrap: balance; }
.bar .sub { font-family: var(--ui); font-size: 13px; color: var(--muted); margin: 2px 0 0; }
.nav { display: flex; gap: 6px; }
.nav button { min-width: 44px; height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-size: 20px; cursor: pointer; }
.nav button.today { font-family: var(--ui); font-size: 13px; padding: 0 10px; }

/* session cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 16px 0; padding: 16px; }
.card.done { border-color: var(--ok); }
.card .head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.card .time { font-family: var(--ui); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.card h2 { font-family: var(--display); font-size: 25px; line-height: 1.15; font-weight: 700; margin: 2px 0 0; text-wrap: balance; }
.card .topic { font-style: italic; color: var(--muted); margin: 4px 0 0; }
.donebtn { flex: none; font-family: var(--ui); font-size: 13px; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
.card.done .donebtn { background: var(--ok); color: var(--bg); border-color: var(--ok); }
.lab { font-family: var(--ui); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 18px 0 6px; font-weight: 600; }
.read { font-size: 19px; line-height: 1.4; margin: 0; }
.links { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.links a { display: flex; flex-direction: column; gap: 1px; padding: 10px 12px; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--fg); background: var(--bg); overflow-wrap: anywhere; }
.links a span { font-family: var(--ui); font-size: 12px; color: var(--accent); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.steps label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; min-height: 44px; cursor: pointer; }
.steps input { width: 22px; height: 22px; flex: none; margin: 2px 0 0; accent-color: var(--accent); }
.steps .t { font-family: var(--ui); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; width: 34px; margin-top: 4px; }
.steps input:checked ~ .x { text-decoration: line-through; color: var(--muted); }
.q { margin: 0 0 14px; }
.q p { margin: 0 0 6px; }
textarea { width: 100%; min-height: 84px; resize: vertical; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; line-height: 1.45; }
ul.plain { margin: 0; padding-left: 20px; }
ul.plain li { margin: 0 0 4px; }
p.para { margin: 10px 0 0; }
details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
summary { font-family: var(--ui); font-size: 13px; color: var(--muted); cursor: pointer; min-height: 32px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }

/* week, terms, notes */
.list { display: grid; gap: 8px; margin: 16px 0; }
.item { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; min-height: 56px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.item .l { min-width: 0; }
.item b { font-family: var(--display); font-size: 20px; font-weight: 700; display: block; }
.item small { font-family: var(--ui); font-size: 12px; color: var(--muted); display: block; overflow-wrap: anywhere; }
.item .r { font-family: var(--ui); font-size: 12px; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.item.cur { border-color: var(--accent); }
h3.sec { font-family: var(--display); font-size: 24px; margin: 26px 0 0; }
.btn { font-family: var(--ui); font-size: 14px; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.note { font-family: var(--ui); font-size: 13px; color: var(--muted); }
.meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; background: var(--ok); }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tabs button { min-height: 48px; border: 0; background: transparent; font-family: var(--ui); font-size: 13px; color: var(--muted); border-radius: 8px; cursor: pointer; }
.tabs button[aria-current="page"] { color: var(--accent); background: var(--surface); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .card { animation: rise .25s ease-out; } @keyframes rise { from { opacity: .0; transform: translateY(6px); } to { opacity: 1; transform: none; } } }
</style>

</head>

nding (borrow)): https://archive.org/search?query=wheelock%27s+latin\n\nPLAN (90 min):\n0:00 Clear the desk. Write the date and the question for the session at the top of the page.\n0:05 First pass. Read straight through. Mark only words you do not know.\n0:40 Second pass. Read slowly with a pencil. Underline claims, circle repeated images, write questions in the margin.\n1:10 Copy passages into your commonplace book and write a short reply to each (10 min).\n1:20 Summarize today's reading in five sentences from memory, then check what you missed.\n1:27 Write three sentences: what the text said, what you doubt, what you want to ask next.\n\nFOCUS QUESTIONS:\n1. How does each transformation punish, preserve or free its subject?\n2. What does Ovid take from the Greek myths, and what does he change?\n\nTHIS WEEK'S WORK FOR THIS COURSE:\n- Stretch goal: a weekly Latin exercise of 10 to 15 sentences from Wheelock, checked against the answer key.\n- Stretch goal: a final Latin passage in week 12. Translate six to eight lines of simple Latin with a dictionary.\n\nCore question for the term: What did the ancients build that we still live inside?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with a pencil. Hard texts get a third pass aloud. If the reading is too long for one session, finish it in Saturday's long session."}, {"id": "T1-W14-Wed-3", "date": "2027-02-10", "start": "19:00", "end": "20:30", "title": "AUT1 | W14 Wed | Philosophy I", "body": "WEEK 14 of 14 | Philosophy I, The Examined Life\nSYLLABUS WEEK 12\nTOPIC: Synthesis\nREAD TODAY: No new reading. Reread your notes and write the final essay\n\nPLAN (90 min):\n0:00 Clear the desk. Write the date and the question for the session at the top of the page.\n0:05 First pass. Read straight through. Mark only words you do not know.\n0:40 Second pass. Read slowly with a pencil. Underline claims, circle repeated images, write questions in the margin.  QUESTIONS:\n1. Which three pieces belong in your portfolio, and why?\n2. What changed in your writing since week 1?\n\nTHIS WEEK'S WORK FOR THIS COURSE:\n- Commonplace book. At least five entries a week from week 1 on, each with a reply.\n- Weekly writing task as listed in the schedule.\n- A portfolio in week 12 with three revised pieces and a one-page reflection.\n\nCore question for the term: How do you turn reading into thinking?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with a pencil. Hard texts get a third pass aloud. If the reading is too long for one session, finish it in Saturday's long session."}, {"id": "T1-W14-Fri", "date": "2027-02-12", "start": "17:00", "end": "19:00", "title": "AUT1 | W14 Fri | Assignments: Classics", "body": "WEEK 14 of 14 | Assignment day\nFOCUS COURSE THIS WEEK: Classics, Greek and Latin Foundations\n\nWORK FOR THE FOCUS COURSE:\n- Stretch goal: a weekly Latin exercise of 10 to 15 sentences from Wheelock, checked against the answer key.\n- Stretch goal: a final Latin passage in week 12. Translate six to eight lines of simple Latin with a dictionary.\n\nALSO DUE THIS WEEK IN OTHER COURSES:\n- Gothic Literature: A comparative essay of 1,500 words in week 12. Compare two works from the syllabus on one theme.\n- Philosophy I: A final essay of 1,800 words in week 12 on the core question. Use at least three thinkers from the course.\n- Rhetoric and Writing: A portfolio in week 12 with three revised pieces and a one-page reflection.\n\nPLAN (2 hours):\n0:00 Read the work list above and pick the first task.\n0:10 Work on it in one deep block. Keep the phone away.\n1:40 Score what you finished with the rubric in Appendix B of the syllabus. Redo anything under 2.5.\n1:55 Write down the next step for each task you left open."}, {"id": "T1-W14-Sat1", "date": "2027-02-13", "start": "09:00", "end": "10:30", "title": "AUT1 | W14 Sat | Part 2: Gothic Literature", "body": "WEEK 14 of 14 | Gothic and Dark Literature\nSYLLABUS WEEK 12\nTOPIC: The modern haunting\nREAD: The Haunting of Hill House, chapters 6 to 9, then your term review\n\nFREE COPIES:\n- Poe, The Fall of the House of Usher (Project Gutenberg): https://www.gutenberg.org/ebooks/932\n- Jackson, The Haunting of Hill House (in copyright) (Internet Archive lending (borrow)): https://archive.org/search?query=haunting+of+hill+house+shirley+jackson\n\nThis finishes the week's reading. You read part 1 on the course day.\n\nPLAN (90 min):\n0:00 Settle in. Clear the desk and write the date.\n0:05 First pass of part 2. Read straight through.\n0:55 Second pass of the hardest passages with a pencil (25 min).\n1:20 Copy passages into your commonplace book (5 min).\n1:25 Write three sentences on the whole week's reading.\n\nFOCUS QUESTIONS:\n1. What does the house want, and what does Eleanor want?\n2. How has the Gothic changed between 1764 and 1959? What stayed the same?\n\n"}, {"id": "T1-W14-Sat2", "date": "2027-02-13", "start": "10:30", "end": "12:00", "title": "AUT1 | W14 Sat | Outing: Philosophy I", "body": "WEEK 14 of 14 | Philosophy I, The Examined Life\nSYLLABUS WEEK 12\nOUTING OR FIELD WORK (90 min):\nTake a long walk with one question from this week. Discuss it with a friend afterward.\n\nTake a notebook. Afterward write 200 words about what you saw and link it to this week's reading.\n\nTHINK ABOUT: Which three thinkers best answer how a person should live?"}, {"id": "T1-W14-Sun", "date": "2027-02-14", "start": "19:00", "end": "19:45", "title": "AUT1 | W14 Sun | Weekly review", "body": "WEEK 14 of 14 | Weekly review (45 min)\n\nSTEPS:\n0:00 Reread this week's commonplace book entries (15 min).\n0:15 Answer one focus question per course aloud or in three sentences (15 min). Starters below.\n0:30 Write new unanswered questions into the Questions section of your commonplace book (5 min).\n0:35 Plan next week. Look at the preview below and set your session times (10 min).\n\nQUEST 200 words in your commonplace book about what you noticed."}, {"id": "T1-F1-Sun", "date": "2027-02-21", "start": "19:00", "end": "19:45", "title": "AUT1 | Finals 1 Sun | Weekly review", "body": "FINALS WEEK 1 | Weekly review (45 min)\n\nReread your commonplace entries. List what is still open for finals week 2. Set your session times for the week ahead."}, {"id": "T1-F2-Mon", "date": "2027-02-22", "start": "19:00", "end": "20:30", "title": "AUT1 | Finals 2 Mon | Philosophy I", "body": "FINALS WEEK 2 | Philosophy I, The Examined Life\n\nTODAY: Draft or finish each of these:\n- A final essay of 1,800 words in week 12 on the core question. Use at least three thinkers from the course.\n\nCore question to answer in your notes: How should a person live?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with a pencil. Hard texts get a third pass aloud."}, {"id": "T1-F2-Tue", "date": "2027-02-23", "start": "19:00", "end": "20:30", "title": "AUT1 | Finals 2 Tue | Philosophy I", "body": "FINALS WEEK 2 | Philosophy I, The Examined Life\n\nTODAY: Revise and polish. Reread your notes for the course and check each item against the Appendix B rubric:\n- A final essay of 1,800 words in week 12 on the core question. Use at least three thinkers from the course.\n\nCore question to answer in your notes: How should a person live?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with a pencil. Hard texts get a third pass aloud."}, {"id": "T1-F2-Wed", "date": "2027-02-24", "start": "19:00", "end": "20:30", "title": "AUT1 | Finals 2 Wed | Rhetoric and Writing", "body": "FINALS WEEK 2 | Rhetoric, Writing and the Commonplace Book\n\nTODAY: Draft or finish each of these:\n- A portfolio in week 12 with three revised pieces and a one-page reflection.\n\nCore question to answer in your notes: How do you turn reading into thinking?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with a pencil. Hard texts get a third pass aloud."}, {"id": "T1-F2-Thu", "date": "2027-02-25", "start": "19:00", "end": "20:30", "title": "AUT1 | Finals 2 Thu | Rhetoric and Writing", "body": "FINALS WEEK 2 | Rhetoric, Writing and the Commonplace Book\n\nTODAY: Revise and polish. Reread your notes for the course and check each item against the Appendix B rubric:\n- A portfolio in week 12 with three revised pieces and a one-page reflection.\n\nCore question to answer in your notes: How do you turn reading into thinking?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with a pencil. Hard texts get a third pass aloud."}, {"id": "T1-F2-Fri", "date": "2027-02-26", "start": "17:00", "end": "19:00", "title": "AUT1 | Finals 2 Fri | Outside reader and scores", "body": "FINALS WEEK 2 | Friday\n\nTODAY: Read the outside reader's comments. Use the outside reader's score when it differs from yours by more than 0.5. Redo any assignment under 2.5.\n\nPLAN (2 hours):\n0:00 Gather the pieces.\n0:15 Do today's task.\n1:45 List what is left for the weekend."}, {"id": "T1-F2-Sat", "date": "2027-02-27", "start": "09:00", "end": "12:00", "title": "AUT1 | Finals 2 Sat | Rest and field time", "body": "FINALS WEEK 2 | Saturday\n\nUse the 3 hours for a walk, a museum, a library visit or a long read of something you chose. Rest is part of the program. Write 200 words in your commonplace book about what you noticed."}, {"id": "T1-F2-Sun", "date": "2027-02-28", "start": "19:00", "end": "19:45", "title": "AUT1 | Finals 2 Sun | Term reflection", "body": "FINALS WEEK 2 | Term reflection (45 min)\n\nReread your notes and commonplace book from this term. Write one page: what you learned, what surprised you, which questions are still open. Next term is Winter: Depth. Courses start tomorrow."}]}, {"name": "Ashmoor Collegium - Winter Term (Depth)", "events": [{"id": "T2-start", "date": "2027-03-01", "start": null, "end": null, "title": "Ashmoor Winter Term begins: Depth", "body": "Term 2 of 4. 14 teaching weeks, then a two-week finals period. Courses: Poetry and Romanticism; History of Art and Architecture; Mythology, Folklore and the Occult; Material Culture, Libraries, Rare Books and the Academic Aesthetic."}, {"id": "T2-W01-Mon-5", "date": "2027-03-01", "start": "19:00", "end": "20:30", "title": "WIN2 | W1 Mon | Poetry", "body": "WEEK 1 of 14 | Poetry and Romanticism\nSYLLABUS WEEK 1\nTOPIC: How to read a poem\nREAD TODAY: Shakespeare, sonnets 18, 29, 73 and 130. Oliver, chapters 1 to 3\n\nFREE COPIES:\n- Poets A to Z, find the poet by name (Poetry Foundation): https://www.poetryfoundation.org/poets\n- Oliver, A Poetry Handbook (in copyright) (Internet Archive lending (borrow)): https://archive.org/search?query=mary+oliver+poetry+handbook\n\nPLAN (90 min):\n0:00 Clear the desk. Write the date and the question for the session at the top of the page.\n0:05 First pass. Read straight through. Mark only words you do not know.\n0:40 Second pass. Read slowly with a pencil. Underline claims, circle repeated images, write questions in the margin.\n1:10 Copy passages into your commonplace book and write a short reply to each (10 min).\n1:20 Summarize today's reading in five sentences from memory, then check what you missed.\n1:27 Write three sentences: what the text said, what you doubt, what you want to ask next.\n\nFOCUS QUESTIONS:\n1. What does each of the four sonnets argue? Where does the turn land?\n2. What did Oliver teach you about sound, line and form that you can use today?\n\nTHIS WEEK'S WORK FOR THIS COURSE:\n- Scansion practice. Scan ten lines each week in weeks 1 to 4.\n\nCore question for the term: What can a poem know that an argument cannot?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with a pencil. Hard texts get a third pass aloud. If the reading is too long for one session, finish it in Saturday's long session."}, {"id": "T2-W01-Tue-6", "date": "2027-03-02", "start": "19:00", "end": "20:30", "title": "WIN2 | W1 Tue | Art and Architecture", "body": "WEEK 1 of 14 | History of Art and Architecture\nSYLLABUS WEEK 1\nTOPIC: How to look\nREAD TODAY: Berger, Ways of Seeing, essays 1 to 3. Practice the description method on any painting\n\nFREE COPIES:\n- Berger, Ways of Seeing (in copyright) (Internet Archive lending (borrow)): https://archive.org/search?query=john+berger+ways+of+seeing\n\nPLAN (90 min):\n0:00 Clear the desk. Write the date and the question for the session at the top of the page.\n0:05 First pass. Read straight through. Mark only words you do not know.\n0:40 Second pass. Read slowly with a pencil. Underline claims, circle repeated images, write questions in the margin.\n1:10 Copy passages into your commonplace book and write a short reply to each (10 min).\n1:20 Summarize today's reading in five sentences from memory, then check what you missed.\n1:27 Write three sentences: what the text said, what you doubt, what you want to ask next.\n\nFOCUS QUESTIONS:\n1. What does Berger say changes when a work is reproduced?\n2. In your chosen painting, what do you see first, second and third?\n\nTHIS WEEK'S WORK FOR THIS COURSE:\n- A description log. Describe one work in 200 words each week, using the structured method from week 1.\n\nCore question for the term: How do buildings and images shape the people who use them?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with a pencil. Hard texts get a third pass aloud. If the reading is too long for one session, finish it in Saturday's long session."}, {"id": "T2-W01-Wed-7", "date": "2027-03-03", "start": "19:00", "end": "20:30", "title": "WIN2 | W1 Wed | Myth and the Occult", "body": "WEEK 1 of 14 | Mythology, Folklore and the Occult\nSYLLABUS WEEK 1\nTOPIC: What is a myth\nREAD TODAY: Hamilton, Mythology, part 1. Introduction to comparative mythology\n\nFREE COPIES:\n- Hamilton, Mythology (in copyright) (Internet Archive lending (borrow)): https://archive.org/search?query=edith+hamilton+mythology\n\nPLAN (90 min):\n0:00 Clear the desk. Write the date and the question for the session at the top of the page.\n0:05 First pass. Read straight through. Mark only words you do not know.\n0:40 Second pass. Read slowly with a pencil. Underline claims, circle repeated images, write questions in the margin.\n1:10 Copy passages into your commonplace book and write a short reply to each (10 min).\n1:20 Summarize today's reading in five sentences from memory, then check what you missed.\n1:27 Write three sentences: what the text said, what you doubt, what you want to ask next.\n\nFOCUS QUESTIONS:\n1. How do myth, legend and folklore differ?\n2. What does comparative mythology offer, and what does it risk?\n\nTHIS WEEK'S WORK FOR THIS COURSE:\nNo assignment is due this week. Keep your commonplace book going.\n\nCore question for the term: Why do people keep believing in hidden knowledge?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with a pencil. Hard texts get a third pass aloud. If the reading is too long for one session, finish it in Saturday's long session."}, {"id": "T2-W01-Thu-8", "date": "2027-03-04", "start": "19:00", "end": "20:30", "title": "WIN2 | W1 Thu | Material Culture", "body": "WEEK 1 of 14 | Material Culture, Libraries, Rare Books and the Academic Aesthetic\nSYLLABUS WEEK 1\nTOPIC: Objects as evidence\nREAD TODAY: Prown, Mind in Matter. Choose one object and describe it in detail\n\nFREE COPIES:\n- Battles, Houston, Jackson, Mauri\u00e8s, Prown, Borges (in copyright) (Open Library and your library's Libby app (borrow)): https://openlibrary.org\n\nPLAN (90 min):\n0:00 Clear the desk. Write the date and the question for the session at the top of the page.\n0:05 First pass. Read straight through. Mark only words you do not know.\n0:40 Second pass. Read slowly with a pencil. Underline claims, circle repeated images, write questions in the margin.\n1:10 Copy passages into your commonplace book and write a short reply to each (10 min).\n1:20 Summarize today's reading in five sentences from memory, then check what you missed.\n1:27 Write three sentences: what the text said, what you doubt, what you want to ask next.\n\nFOCUS QUESTIONS:\n1. What can you say about your object from description alone?\n2. What does the object suggest about the people who made and used it?\n\nTHIS WEEK'S WORK FOR THIS COURSE:\n- An object description of 500 words in week 1.\n\nCore question for the term: What do objects say about the life of the mind?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with a pencil. Hard texts get a third pass aloud. If the reading is too long for one session, finish it in Saturday's long session."}, {"id": "T2-W01-Fri", "date": "2027-03-05", "start": "17:00", "end": "19:00", "title": "WIN2 | W1 Fri | Assignments: Poetry", "body": "WEEK 1 of 14 | Assignment day\nFOCUS COURSE THIS WEEK: Poetry and Romanticism\n\nWORK FOR THE FOCUS COURSE:\n- Scansion practice. Scan ten lines each week in weeks 1 to 4.\n\nALSO DUE THIS WEEK IN OTHER COURSES:\n- Material Culture: An object description of 500 words in week 1.\n\nPLAN (2 hours):\n0:00 Read the work list above and pick the first task.\n0:10 Work on it in one deep block. Keep the phone away.\n1:40 Score what you finished with the rubric in Appendix B of the syllabus. Redo anything under 2.5.\n1:55 Write down the next step for each task you left open."}, {"id": "T2-W01-Sat1", "date": "2027-03-06", "start": "09:00", "end": "10:30", "title": "WIN2 | W1 Sat | Third pass: Art and Architecture", "body": "WEEK 1 of 14 | History of Art and Architecture\nSYLLABUS WEEK 1\nTOPIC: How to look\nREAD: Berger, Ways of Seeing, essays 1 to 3. Practice the description method on any painting\n\nFREE COPIES:\n- Berger, Ways of Seeing (in copyright) (Internet Archive lending (borrow)): https://archive.org/search?query=john+berger+ways+of+seeing\n\nPLAN (90 min):\n0:00 Settle in. Clear the desk and write the date.\n0:05 Third pass of this week's reading for this course, aloud where it helps (70 min).\n1:15 Write 200 words in your commonplace book. Link this reading to one from another course.\n\nFOCUS QUESTIONS:\n1. What does Berger say changes when a work is reproduced?\n2. In your chosen painting, what do you see first, second and third?\n\n"}, {"id": "T2-W01-Sat2", "date": "2027-03-06", "start": "10:30", "end": "12:00", "title": "WIN2 | W1 Sat | Outing: Art and Architecture", "body": "WEEK 1 of 14 | History of Art and Architecture\nSYLLABUS WEEK 1\nOUTING OR FIELD WORK (90 min):\nVisit a museum, church or campus. Describe one work or building in 200 words.\n\nTake a notebook. Afterward write 200 words about what you saw and link it to this week's reading.\n\nTHINK ABOUT: What does Berger say changes when a work is reproduced?"}, {"id": "T2-W01-Sun", "date": "2027-03-07", "start": "19:00", "end": "19:45", "title": "WIN2 | W1 Sun | Weekly review", "body": "WEEK 1 of 14 | Weekly review (45 min)\n\nSTEPS:\n0:00 Reread this week's commonplace book entries (15 min).\n0:15 Answer one focus question per course aloud or in three sentences (15 min). Starters below.\n0:30 Write new unanswered questions into the Questions section of your commonplace book (5 min).\n0:35 Plan next week. Look at the preview below and set your session times (10 min).\n\nQUESTION STARTERS:\n- Poetry: What does each of the four sonnets argue? Where does the turn land?\n- Art and Architecture: What does Berger say changes when a work is reproduced?\n- Myth and the Occult: How do myth, legend and folklore differ?\n- Material Culture: What can you say about your object from description alone?\n\nNEXT WEEK'S READINGS jects tell?\n\nNEXT: Finals period begins tomorrow. Two weeks to finish and polish final work."}, {"id": "T2-finals", "date": "2027-06-07", "start": null, "end": null, "title": "Ashmoor Winter finals period begins", "body": "Two weeks. Finish and polish final work, give pieces to an outside reader, and write your term reflection."}, {"id": "T2-F1-Mon", "date": "2027-06-07", "start": "19:00", "end": "20:30", "title": "WIN2 | Finals 1 Mon | Poetry", "body": "FINALS WEEK 1 | Poetry and Romanticism\n\nTODAY: Draft or finish each of these:\n- A final essay of 1,500 words in week 12 on a Romantic idea, such as the sublime, nature or the imagination, drawn from three poets.\n\nCore question to answer in your notes: What can a poem know that an argument cannot?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with a pencil. Hard texts get a third pass aloud."}, {"id": "T2-F1-Tue", "date": "2027-06-08", "start": "19:00", "end": "20:30", "title": "WIN2 | Finals 1 Tue | Poetry", "body": "FINALS WEEK 1 | Poetry and Romanticism\n\nTODAY: Revise and polish. Reread your notes for the course and check each item against the Appendix B rubric:\n- A final essay of 1,500 words in week 12 on a Romantic idea, such as the sublime, nature or the imagination, drawn from three poets.\n\nCore question to answer in your notes: What can a poem know that an argument cannot?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with a pencil. Hard texts get a third pass aloud."}, {"id": "T2-F1-Wed", "date": "2027-06-09", "start": "19:00", "end": "20:30", "title": "WIN2 | Finals 1 Wed | Art and Architecture", "body": "FINALS WEEK 1 | History of Art and Architecture\n\nTODAY: Draft or finish each of these:\n- A field report of 1,500 words in week 12. Visit one building or collection in person. Describe it, place it in a style and argue what it does to the people insid s: Reason", "body": "Term 3 of 4. 14 teaching weeks, then a two-week finals period. Courses: Mathematics and Logic; Natural Science; History of Science and Natural Philosophy; Philosophy II, Ethics, Mind and the Modern World."}, {"id": "T3-W01-Mon-9", "date": "2027-06-21", "start": "19:00", "end": "20:30", "title": "SPR3 | W1 Mon | Math and Logic", "body": "WEEK 1 of 14 | Mathematics and Logic\nSYLLABUS WEEK 1\nTOPIC: Logic and argument\nREAD TODAY: Hammack, chapter on logic. Carroll, What the Tortoise Said to Achilles. Build truth tables\n\nFREE COPIES:\n- Hammack, Book of Proof (free from the author) (Richard Hammack, VCU): https://www.people.vcu.edu/~rhammack/BookOfProof/indexRED.html\n- Hammack, Book of Proof (open textbook library) (Open Textbook Library): https://open.umn.edu/opentextbooks/textbooks/book-of-proof\n- Carroll, What the Tortoise Said to Achilles (Wikisource (search)): https://en.wikisource.org/w/index.php?search=What+the+Tortoise+Said+to+Achilles\n\nPLAN (90 min):\n0:00 Clear the desk. Write the date and the question for the session at the top of the page.\n0:05 First pass. Read straight through. Mark only words you do not know.\n0:40 Second pass. Read slowly with a pencil. Underline claims, circle repeated images, write questions in the margin.\n1:10 Copy passages into your commonplace book and write a short reply to each (10 min).\n1:20 Summarize today's reading in five sentences from memory, then check what you missed.\n1:27 Write three sentences: what the text said, what you doubt, what you want to ask next.\n\nFOCUS QUESTIONS:\n1. What does the Tortoise show about rules of inference?\n2. Which of your truth tables are tautologies?\n\nTHIS WEEK'S WORK FOR THIS COURSE:\n- A problem set each week from weeks 1 to 10. Solve six problems and show every step.\n\nCore question for the term: What does it mean to prove something?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with TOPIC: Ancient natural philosophy\nREAD TODAY: Lucretius, selections. Aristotle on nature\n\nFREE COPIES:\n- Lucretius, On the Nature of Things (Project Gutenberg): https://www.gutenberg.org/ebooks/785\n- Lucretius, On the Nature of Things (second text) (MIT Internet Classics Archive): https://classics.mit.edu/Carus/nature_things.html\n\nPLAN (90 min):\n0:00 Clear the desk. Write the date and the question for the session at the top of the page.\n0:05 First pass. Read straight through. Mark only words you do not know.\n0:40 Second pass. Read slowly with a pencil. Underline claims, circle repeated images, write questions in the margin.\n1:10 Copy passages into your commonplace book and write a short reply to each (10 min).\n1:20 Summarize today's reading in five sentences from memory, then check what you missed.\n1:27 Write three sentences: what the text said, what you doubt, what you want to ask next.\n\nFOCUS QUESTIONS:\n1. How does Lucretius explain nature with atoms?\n2. How does Aristotle's account of nature differ?\n\nTHIS WEEK'S WORK FOR THIS COURSE:\nNo assignment is due this week. Keep your commonplace book going.\n\nCore question for the term: How did curiosity become method?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with a pencil. Hard texts get a third pass aloud. If the reading is too long for one session, finish it in Saturday's long session."}, {"id": "T3-W01-Thu-12", "date": "2027-06-24", "start": "19:00", "end": "20:30", "title": "SPR3 | W1 Thu | Philosophy II", "body": "WEEK 1 of 14 | Philosophy II, Ethics, Mind and the Modern World\nSYLLABUS WEEK 1\nTOPIC: Knowledge and cause\nREAD TODAY: Hume, Enquiry, sections 4 and 5\n\nFREE COPIES:\n- Hume, An Enquiry Concerning Human Understanding (Project Gutenberg): https://www.gutenberg.org/files/9662/9662-h/9662-h.htm\n\nPLAN (90 min):\n0:00 Clear the desk. Write the date and the question for the session at the top of the page.\n0:05 First pass. Read straight through. Mark only words you do not know.\n0:40 Second pass. Read slowly with a pencil. Underline claims, circle repeated images, write questions in the margin.\n1:10 Copy passages into your commonplace book and write a short reply to each (10 min).\n1:20 Summarize today's reading in five sentences from memory, then check what you missed.\n1:27 Write three sentences: what the text said, what you doubt, what you want to ask next.\n\nFOCUS QUESTIONS:\n1. What is the problem of induction?\n2. What does Hume mean by custom?\n\nTHIS WEEK'S WORK FOR THIS COURSE:\n- A one-page argument map each week.\n\nCore question for the term: What do we owe one another, and what is a mind?\n\nMethod: read every text twice. First pass straight through, marking only words you do not know. Second pass slowly with a pencil. Hard texts get a third pass aloud. If the reading is too long for one session, finish it in Saturday's long session."}, {"id": "T3-W01-Fri", "date": "2027-06-25", "start": "17:00", "end": "19:00", "title": "SPR3 | W1 Fri | Assignments: Math and Logic", "body": "WEEK 1 of 14 | Assignment day\nFOCUS COURSE THIS WEEK: Mathematics and Logic\n\nWORK FOR THE FOCUS COURSE:\n- A problem set each week from weeks 1 to 10. Solve six problems and show every step.\n\nALSO DUE THIS WEEK IN OTHER COURSES:\nNothing else is due by date this week.\n\nPLAN (2 hours):\n0:00 Read the work list above and pick the first task.\n0:10 Work on it in one deep block. Keep the phone away.\n1:40 Score what you finished with the rubric in Appendix B of the syllabus. Redo anything under 2.5.\n1:55 Write down the next step for each task you left open."}, {"id": "T3-W01-Sat1", "date": "2027-06-26", "start": "09:00", "end": "10:30", "title": "SPR3 | W1 Sat | Third pass: Natural Science", "body": "WEEK 1 of 14 | Natural Science\nSYLLABUS WEEK 1\nTOPIC: The scientist's notebook\nREAD: Hooke, Micrographia, preface. Start your field notebook with a sketch and measurements of one o     saveT = setTimeout(function () { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 300);
  }

  // ---- helpers
  var DAYN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pd(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmt(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function long(s) { var d = pd(s); return DAYN[d.getDay()] + ", " + MON[d.getMonth()] + " " + d.getDate(); }
  function short(s) { var d = pd(s); return MON[d.getMonth()].slice(0, 3) + " " + d.getDate(); }
  function mondayOf(s) { var d = pd(s); var k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return fmt(d); }
  function t12(t) { if (!t) return ""; var p = t.split(":"), h = +p[0]; return (h % 12 || 12) + ":" + p[1] + " " + (h < 12 ? "AM" : "PM"); }
  function linkify(s) { return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
  function course(e) { var p = e.title.split("|"); return p.length > 2 ? p.slice(2).join("|").trim() : e.title; }
  function slot(e) { var p = e.title.split("|"); return p.length > 1 ? p[1].trim() : ""; }
  function nearest(s) {
    if (DATES.indexOf(s) >= 0) return s;
    for (var i = 0; i < DATES.length; i++) if (DATES[i] > s) return DATES[i];
    return DATES[DATES.length - 1];
  }

  // ---- body parser
  function isKey(line) {
    if (line.charAt(0) === "-") return null;
    var i = line.indexOf(":"); if (i < 1) return null;
    var key = line.slice(0, i), base = key.replace(/\(.*?\)/g, "").trim();
    if (base.length > 48 || base !== base.toUpperCase() || !/[A-Z]{3}/.test(base)) return null;
    return { key: key.trim(), rest: line.slice(i + 1).trim() };
  }
  function parse(body) {
    var lines = body.split("\n"), secs = [], cur = null, head = "";
    lines.forEach(function (ln, idx) {
      if (idx === 0) { head = ln; return; }
      if (!ln.trim()) { cur = null; return; }
      if (/^SYLLABUS WEEK/.test(ln)) { return; }
      var k = isKey(ln);
      if (k) { cur = { key: k.key, lines: k.rest ? [k.rest] : [] }; secs.push(cur); return; }
      if (!cur) { cur = { key: null, lines: [] }; secs.push(cur); }
      cur.lines.push(ln);
    });
    return { head: head, secs: secs };
  }

  // ---- render one session
  function sessionHTML(e) {
    var P = parse(e.body), id = e.id, h = "";
    var isDone = !!S.done[id];
    var tm = e.start ? t12(e.start) + " to " + t12(e.end) : "All day";
    var topic = "";
    P.secs.forEach(function (s) { if (s.key === "TOPIC") topic = s.lines.join(" "); });
    h += '<article class="card' + (isDone ? " done" : "") + '" data-id="' + id + '">';
    h += '<div class="head"><div style="min-width:0"><p class="time">' + esc(tm) + " &middot; " + esc(slot(e)) + "</p><h2>" + esc(course(e)) + "</h2>";
    if (topic) h += '<p class="topic">' + esc(topic) + "</p>";
    h += '</div><button class="donebtn" data-done="' + id + '" aria-pressed="' + isDone + '">' + (isDone ? "Done" : "Mark done") + "</button></div>";
    var hasQ = false;
    P.secs.forEach(function (s) {
      var key = s.key, ls = s.lines;
      if (key === "TOPIC") return;
      if (key === null) {
        var t = ls.join(" ");
        if (/^Method:/.test(t)) { h += "<details><summary>Method</summary><p class='para'>" + esc(t.replace(/^Method:\s*/, "")) + "</p></details>"; }
        else if (/^Core question/.test(t)) { h += '<p class="para"><em>' + esc(t) + "</em></p>"; }
        else h += '<p class="para">' + linkify(t) + "</p>";
        return;
      }
      var base = key.replace(/\(.*?\)/g, "").trim();
      var label = key.charAt(0) + key.slice(1).toLowerCase();
      if (/^READ/.test(base)) { h += '<div class="lab">' + esc(label) + '</div><p class="read">' + esc(ls.join(" ")) + "</p>"; return; }
      if (base === "FREE COPIES") {
        h += '<div class="lab">Free copies</div><ul class="links">';
        ls.forEach(function (l) {
          var m = l.replace(/^-\s*/, ""), j = m.lastIndexOf(": http");
          if (j < 0) { h += "<li>" + linkify(m) + "</li>"; return; }
          var name = m.slice(0, j), url = m.slice(j + 2), src = "", pm = name.match(/^(.*)\(([^()]*)\)\s*$/);
          if (pm) { name = pm[1].trim(); src = pm[2]; }
          h += '<li><a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(name) + (src ? "<span>" + esc(src) + "</span>" : "") + "</a></li>";
        });
        h += "</ul>"; return;
      }
      if (base === "PLAN" || base === "STEPS") {
        h += '<div class="lab">' + esc(key.charAt(0) + key.slice(1).toLowerCase().replace(/\bmin\b/, "min")) + '</div><ul class="steps">';
        var sd = S.steps[id] || [];
        ls.forEach(function (l, i) {
          var m = l.match(/^(\d+:\d\d)\s+(.*)$/);
          var chk = sd.indexOf(i) >= 0 ? " checked" : "";
          h += '<li><label><input type="checkbox" data-step="' + id + ":" + i + '"' + chk + '><span class="t">' + (m ? m[1] : "") + '</span><span class="x">' + esc(m ? m[2] : l) + "</span></label></li>";
        });
        h += "</ul>"; return;
      }
      if (base === "FOCUS QUESTIONS") {
        hasQ = true;
        h += '<div class="lab">Focus questions</div>';
        ls.forEach(function (l, i) {
          var q = l.replace(/^\d+\.\s*/, "");
          var v = S.ans[id + ":q" + i] || "";
          h += '<div class="q"><p>' + (i + 1) + ". " + esc(q) + '</p><textarea id="a-' + id + "-" + i + '" data-ans="' + id + ":q" + i + '" placeholder="Your answer">' + esc(v) + "</textarea></div>";
        });
        return;
      }
      h += '<div class="lab">' + esc(label.replace(/'S\b/, "'s")) + "</div>";
      var bl = ls.every(function (l) { return /^-\s/.test(l); });
      if (bl) { h += '<ul class="plain">' + ls.map(function (l) { return "<li>" + linkify(l.replace(/^-\s*/, "")) + "</li>"; }).join("") + "</ul>"; }
      else h += '<p class="para" style="margin-top:0">' + ls.map(linkify).join("<br>") + "</p>";
    });
    if (e.start) {
      h += '<div class="lab">' + (hasQ ? "Notes and passages" : "Notes") + '</div><textarea id="n-' + id + '" data-ans="' + id + ':note" placeholder="Passages copied, words to look up, questions for later">' + esc(S.ans[id + ":note"] || "") + "</textarea>";
    }
    return h + "</article>";
  }

  // ---- views
  var view = "today", cur = nearest(fmt(new Date())), app = document.getElementById("app");
  var TABS = [["today", "Today"], ["week", "Week"], ["terms", "Terms"], ["notes", "Notes"]];
  function drawTabs() {
    document.getElementById("tabs").innerHTML = TABS.map(function (t) {
      return '<button data-tab="' + t[0] + '"' + (view === t[0] ? ' aria-current="page"' : "") + ">" + t[1] + "</button>";
    }).join("");
  }
  function weekInfo(e) {
    var m = e.title.match(/W(\d+) /), h = e.body.match(/^WEEK (\d+) of (\d+)/), f = e.title.match(/Finals (\d)/);
    if (f) return "Finals week " + f[1];
    if (h) return "Week " + h[1] + " of " + h[2];
    return m ? "Week " + m[1] : "";
  }
  function bar(title, sub, nav) {
    return '<header class="bar"><p class="motto">Ex cinere lumen &middot; Ashmoor Collegium</p><div class="row"><h1>' + title + "</h1>" + (nav || "") + "</div>" + (sub ? '<p class="sub">' + sub + "</p>" : "") + "</header>";
  }
  function todayView() {
    var evs = BYDATE[cur] || [], tn = TERMS[evs[0].term].name.replace("Ashmoor Collegium - ", "");
    var wk = ""; evs.forEach(function (e) { if (!wk) wk = weekInfo(e); });
    var i = DATES.indexOf(cur);
    var nav = '<div class="nav"><button data-go="-1" aria-label="Previous day"' + (i < 1 ? " disabled" : "") + '>&lsaquo;</button><button class="today" data-go="today">Today</button><button data-go="1" aria-label="Next day"' + (i >= DATES.length - 1 ? " disabled" : "") + ">&rsaquo;</button></div>";
    var h = bar(long(cur), esc(tn) + (wk ? " &middot; " + wk : ""), nav);
    evs.forEach(function (e) { if (e.start) h += sessionHTML(e); });
    evs.forEach(function (e) { if (!e.start) h += sessionHTML(e); });
    return h;
  }
  function doneCount(evs) { var n = 0, t = 0; evs.forEach(function (e) { if (e.start) { t++; if (S.done[e.id]) n++; } }); return [n, t]; }
  function weekView() {
    var mon = mondayOf(cur), days = [];
    var d0 = pd(mon);
    for (var k = 0; k < 7; k++) { var d = new Date(d0); d.setDate(d0.getDate() + k); days.push(fmt(d)); }
    var evs0 = BYDATE[nearest(mon)] || [], wk = evs0.length ? weekInfo(evs0[0]) : "";
    var h = bar("Week of " + short(mon), wk), items = "";
    days.forEach(function (ds) {
      var ev = (BYDATE[ds] || []).filter(function (e) { return e.start; });
      if (!ev.length) return;
      var c = doneCount(ev);
      items += '<button class="item' + (ds === cur ? " cur" : "") + '" data-day="' + ds + '"><span class="l"><b>' + DAYN[pd(ds).getDay()] + " " + pd(ds).getDate() + "</b><small>" + esc(ev.map(function (e) { return course(e); }).join(" / ")) + '</small></span><span class="r">' + c[0] + "/" + c[1] + "</span></button>";
    });
    return h + '<div class="list">' + (items || '<p class="empty">No sessions this week.</p>') + "</div>";
  }
  function termsView() {
    var h = bar("Terms", "Tap a week to open it.");
    TERMS.forEach(function (t) {
      var weeks = {}, order = [];
      t.events.forEach(function (e) { var m = mondayOf(e.date); if (!weeks[m]) { weeks[m] = []; order.push(m); } weeks[m].push(e); });
      var c = doneCount(t.events);
      h += '<h3 class="sec">' + esc(t.name.replace("Ashmoor Collegium - ", "")) + '</h3><div class="note">' + short(t.events[0].date) + " to " + short(t.events[t.events.length - 1].date) + " &middot; " + c[0] + " of " + c[1] + ' sessions done</div><div class="meter"><i style="width:' + (c[1] ? Math.round(100 * c[0] / c[1]) : 0) + '%"></i></div><div class="list">';
      order.sort().forEach(function (m) {
        var ev = weeks[m], wk = ""; ev.forEach(function (e) { if (!wk) wk = weekInfo(e); });
        var dc = doneCount(ev);
        h += '<button class="item' + (mondayOf(cur) === m ? " cur" : "") + '" data-day="' + m + '"><span class="l"><b>' + esc(wk || "Week") + "</b><small>" + short(m) + "</small></span><span class=\"r\">" + dc[0] + "/" + dc[1] + "</span></button>";
      });
      h += "</div>";
    });
    return h;
  }
  function exportText() {
    var out = [];
    ALL.forEach(function (e) {
      var p = parse(e.body), parts = [];
      var qs = []; p.secs.forEach(function (s) { if (s.key && /^FOCUS QUESTIONS/.test(s.key)) qs = s.lines; });
      qs.forEach(function (q, i) { var a = S.ans[e.id + ":q" + i]; if (a && a.trim()) parts.push("Q" + (i + 1) + ". " + q.replace(/^\d+\.\s*/, "") + "\n" + a.trim()); });
      var n = S.ans[e.id + ":note"]; if (n && n.trim()) parts.push("Notes:\n" + n.trim());
      if (parts.length || S.done[e.id]) out.push("== " + e.date + " " + course(e) + (S.done[e.id] ? " (done)" : "") + "\n" + parts.join("\n\n"));
    });
    return out.join("\n\n") || "Nothing written yet.";
  }
  function notesView() {
    var all = doneCount(ALL), words = 0;
    Object.keys(S.ans).forEach(function (k) { words += (S.ans[k] || "").trim().split(/\s+/).filter(Boolean).length; });
    var h = bar("Notes", "Your answers live on this device.");
    h += '<div class="card"><div class="lab" style="margin-top:0">Progress</div><p class="read">' + all[0] + " of " + all[1] + " sessions done. " + words + ' words written.</p><div class="meter"><i style="width:' + Math.round(100 * all[0] / all[1]) + '%"></i></div></div>';
    h += '<div class="card"><div class="lab" style="margin-top:0">Back up your answers</div><p class="note">Browser storage can be cleared. Copy your work and paste it into Notes or Mail now and then.</p><div class="btns"><button class="btn" data-act="copy">Copy readable text</button><button class="btn ghost" data-act="copyjson">Copy restore code</button></div><textarea id="exp" readonly style="display:none;min-height:160px"></textarea></div>';
    h += '<div class="card"><div class="lab" style="margin-top:0">Restore</div><p class="note">Paste a restore code to bring your answers back.</p><textarea id="imp" placeholder="Paste restore code here"></textarea><div class="btns"><button class="btn ghost" data-act="import">Restore</button></div><p class="note" id="msg" role="status"></p></div>';
    h += '<p class="note">Syllabus data: ' + TERMS.length + " terms, " + ALL.length + " calendar entries.</p>";
    return h;
  }
  function draw(keepScroll) {
    var y = window.scrollY;
    drawTabs();
    app.innerHTML = '<div class="wrap">' + ({ today: todayView, week: weekView, terms: termsView, notes: notesView }[view])() + "</div>";
    autosize();
    window.scrollTo(0, keepScroll ? y : 0);
  }
  function autosize() {
    var tas = app.querySelectorAll("textarea[data-ans]");
    for (var i = 0; i < tas.length; i++) { var t = tas[i]; t.style.height = "auto"; t.style.height = Math.max(84, t.scrollHeight + 2) + "px"; }
  }
  function say(m) { var el = document.getElementById("msg"); if (el) el.textContent = m; }
  function showExport(text) {
    var ta = document.getElementById("exp"); ta.style.display = "block"; ta.value = text;
    var ok = false;
    try { navigator.clipboard.writeText(text).then(function () { say("Copied."); }, function () { ta.focus(); ta.select(); say("Select the text above and copy it."); }); ok = true; } catch (e) {}
    if (!ok) { ta.focus(); ta.select(); say("Select the text above and copy it."); }
  }

  // ---- events
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-tab],[data-go],[data-day],[data-done],[data-act]");
    if (!t) return;
    if (t.dataset.tab) { view = t.dataset.tab; draw(false); return; }
    if (t.dataset.go) {
      var i = DATES.indexOf(cur);
      if (t.dataset.go === "today") cur = nearest(fmt(new Date())); else cur = DATES[Math.min(DATES.length - 1, Math.max(0, i + (+t.dataset.go)))];
      draw(false); return;
    }
    if (t.dataset.day) { cur = nearest(t.dataset.day); view = "today"; draw(false); return; }
    if (t.dataset.done) { S.done[t.dataset.done] = !S.done[t.dataset.done]; persist(); draw(true); return; }
    if (t.dataset.act === "copy") { showExport(exportText()); }
    if (t.dataset.act === "copyjson") { showExport(JSON.stringify(S)); }
    if (t.dataset.act === "import") {
      try {
        var o = JSON.parse(document.getElementById("imp").value);
        if (!o || typeof o !== "object" || !o.ans) throw 0;
        S = { done: o.done || {}, steps: o.steps || {}, ans: o.ans || {} }; persist(); say("Restored.");
      } catch (e) { say("That code did not work. Copy the whole restore code and try again."); }
    }
  });
  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.ans) { S.ans[t.dataset.ans] = t.value; persist(); autosize(); }
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.step) {
      var p = t.dataset.step.split(":"), a = S.steps[p[0]] || [], i = +p[1], at = a.indexOf(i);
      if (t.checked && at < 0) a.push(i); if (!t.checked && at >= 0) a.splice(at, 1);
      S.steps[p[0]] = a; persist();
    }
  });
  draw(false);
})();
</script>

<script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
